name: SonarQube

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarqube:
    runs-on: [self-hosted, linux]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests with coverage (lcov for SonarQube)
        run: >
          pnpm exec jest --coverage
          --coverageDirectory="$PWD/coverage"
          --coverageReporters=lcov --coverageReporters=text-summary
          --collectCoverageFrom='**/*.ts' --collectCoverageFrom='!**/*.spec.ts'

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=SolutionChamps-Technolgies_eos-phoenix-poc
            -Dsonar.sources=src
            -Dsonar.tests=test
            -Dsonar.exclusions=**/*.spec.ts,**/*.e2e-spec.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
