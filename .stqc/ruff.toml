# STQC / ISO 25010 maintainability + security lint baseline
target-version = "py312"
line-length = 100
src = ["src", "app", "."]

[lint]
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # isort
  "N",           # pep8-naming
  "UP",          # pyupgrade
  "B",           # bugbear (real bug patterns)
  "A",           # builtin shadowing
  "C4",          # comprehensions
  "S",           # flake8-bandit (security)
  "T20",         # no print() in prod code
  "SIM",         # simplify
  "PTH",         # pathlib over os.path
  "RUF",         # ruff-specific
  "C90",         # mccabe complexity
]
ignore = ["E501"]           # line length handled by formatter

[lint.mccabe]
max-complexity = 10          # ISO 25010 maintainability signal

[lint.per-file-ignores]
"tests/**" = ["S101"]        # assert is fine in tests
